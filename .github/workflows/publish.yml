name: Publish packages

on:
  push:
    tags:
      - "jittor-v*"
      - "pi-jittor-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish-jittor:
    if: startsWith(github.ref_name, 'jittor-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/jittor
      tag-prefix: jittor-v
      package-manager: bun
      lint-command: bun run lint:ci
      test-command: bun test
      typecheck-command: bun run typecheck

  publish-pi-jittor:
    if: startsWith(github.ref_name, 'pi-jittor-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-jittor
      tag-prefix: pi-jittor-v
      package-manager: bun
      lint-command: bun run lint:ci
      test-command: bun test
      typecheck-command: bun run typecheck
