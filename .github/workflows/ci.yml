name: CI

# Runs both packages' tests and typecheck on every push/PR -- a monorepo-
# specific need: a change to packages/jittor's public exports can silently
# break packages/pi-jittor without this, since the two are only ever
# exercised together here, not in either package's own publish workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint:ci
      - run: bun test
      - run: bun run typecheck
